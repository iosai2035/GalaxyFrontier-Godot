# Galaxy Frontier — iOS IPA build (Godot 4).
# Local file only: NOT run here, NOT pushed. The parent agent runs
# it later on GitHub Actions (macos-15 runner). Unsigned IPA:
# CODE_SIGNING_ALLOWED=NO, then re-sign on device via SideStore.
# Godot 4.4.1 + export templates, Xcode project export, xcodebuild.
name: Build iOS IPA (Godot)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip
          unzip -q godot.zip
          mkdir -p ~/godot
          mv Godot.app ~/godot/
          echo "$HOME/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Download export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.4.1.stable
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/Library/Application\ Support/Godot/export_templates/4.4.1.stable/

      - name: Import project
        run: |
          Godot --headless --import --path .

      - name: Export iOS Xcode project
        run: |
          mkdir -p GalaxyFrontier-iOS
          Godot --headless --export-release "iOS" GalaxyFrontier-iOS/GalaxyFrontier.xcodeproj

      - name: Build unsigned IPA
        working-directory: GalaxyFrontier-iOS
        run: |
          xcodebuild -project GalaxyFrontier.xcodeproj -scheme GalaxyFrontier -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Release-iphoneos/GalaxyFrontier.app Payload/
          zip -r GalaxyFrontier.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyFrontier-iOS-unsigned
          path: GalaxyFrontier-iOS/GalaxyFrontier.ipa
          retention-days: 7
